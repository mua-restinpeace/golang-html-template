{{define "content"}}
<h2>Product Page</h2>

<a class="button" href="/products/form">Add products</a>
<br>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Stock</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {{range .products}}
    <tr>
      <td>{{.ID}}</td>
      <td>{{.Name}}</td>
      <td>{{.Price}}</td>
      <td>{{.Stock}}</td>
      <td style="display: inline-flex; align-items: center; gap: 12px;">
        <a href="/products/{{.ID}}/edit">Edit</a>
        <form  action="/products/{{.ID}}/hapus" method="post" onsubmit="return confirm('Are you sure you want to delete this item?');">
          <button class="button" type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>

{{end}}
