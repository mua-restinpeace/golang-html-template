{{define "content"}}
<div class="page-header">
  <h2>Product Page</h2>
  <a class="button" href="/products/form">Add products</a>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {{range .products}}
      <tr>
        <td>{{.ID}}</td>
        <td>{{.Name}}</td>
        <td>{{.Price}}</td>
        <td>{{.Stock}}</td>
        <td>
          <div class="actions">
            <a class="button button--secondary button--sm" href="/products/{{.ID}}/edit">Edit</a>
            <form action="/products/{{.ID}}/hapus" method="post" onsubmit="return confirm('Are you sure you want to delete this item?');">
              <button class="button button--danger button--sm" type="submit">Delete</button>
            </form>
          </div>
        </td>
      </tr>
      {{else}}
      <tr>
        <td class="empty" colspan="5">No products yet.</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>

{{end}}
