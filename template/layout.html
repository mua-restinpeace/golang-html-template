{{define "layout"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}} — Lova Store</title>

    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    {{template "header" .}}

    <div class="layout">
      {{template "sidebar" .}}

      <div class="main">
        <main class="content">{{template "content" .}}</main>

        {{template "footer" .}}
      </div>
    </div>
  </body>
</html>
{{end}}
